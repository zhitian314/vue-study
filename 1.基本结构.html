<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../../vue学习/vue.js"></script>
</head>

<body>
    <div id="app">
        <h2>{{ title }}</h2>
        <button @click="sayHello">点击我</button>
    </div>
    <script>
        var app = new Vue({
            el: '#app',
            data: {
                title: 'Vue 2 学习开始！'
            },
            methods: {
                sayHello: function () {
                    alert('Hello Vue!');
                }

            }
        });
    </script>
</body>

</html>
