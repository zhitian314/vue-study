<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="../../vue学习/vue.js"></script>
</head>

<body>
    <div id="app">
        <ul>
            <li v-for="(fruit,index) in fruits" :key="fruit">
                {{index + 1}}.{{fruit}}
            </li>
        </ul>
    </div>
    <script>
        new Vue({
            el: '#app',
            data: {
                fruits: ['苹果', '香蕉', '梨']
            }
        })
    </script>
</body>

</html>
